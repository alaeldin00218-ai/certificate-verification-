<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق من الشهادة</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
    }

    .container {
        max-width: 500px;
        margin: 40px auto;
        padding: 20px;
    }

    .card {
        background: white;
        border-radius: 22px;
        padding: 28px 22px;
        box-shadow: 0 8px 30px rgba(0,0,0,.10);
        text-align: center;
    }

    .logos {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-bottom: 20px;
    }

    .logo {
        width: 85px;
        height: 85px;
        object-fit: contain;
        border-radius: 12px;
    }

    h1 {
        color: #0877c9;
        margin-bottom: 8px;
    }

    .verified {
        color: #159447;
        font-size: 20px;
        font-weight: bold;
        margin: 18px 0;
    }

    .data {
        text-align: right;
        background: #f7f9fc;
        border-radius: 15px;
        padding: 18px;
        line-height: 2;
    }

    .data strong {
        color: #0877c9;
    }

    .footer {
        margin-top: 25px;
        font-size: 13px;
        color: #777;
    }
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <!-- ضع صور الشعارات هنا -->
        <div class="logos">
            <img src="hesperides.png" class="logo" alt="أكاديمية هسبريدس">
            <img src="morabbaat.png" class="logo" alt="شركة المربعات الهندسية">
        </div>

        <h1>التحقق من الشهادة</h1>

        <div class="verified">
            ✓ تم التحقق بنجاح
        </div>

        <div class="data">
            <div><strong>الاسم:</strong> علاء الدين آدم محمد علي</div>
            <div><strong>الجهة:</strong> أكاديمية هسبريدس</div>
            <div><strong>الشركة:</strong> شركة المربعات الهندسية</div>
            <div><strong>الدورة:</strong> الهندسة المدنية والتصميم والتنفيذ</div>
            <div><strong>التخصص:</strong> الهندسة المدنية</div>
            <div><strong>تاريخ التخرج:</strong> 15 يوليو 2026</div>
        </div>

        <div class="footer">
            هذه الصفحة مخصصة للتحقق من صحة بيانات الشهادة.
        </div>

    </div>
</div>

</body>
</html>
