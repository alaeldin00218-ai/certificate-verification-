<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق من الشهادة</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Tahoma,sans-serif;
background:linear-gradient(145deg,#eef4f8,#fff);color:#172033;
display:flex;justify-content:center;padding:28px 14px}
.card{width:min(520px,100%);background:#fff;border-radius:24px;padding:28px 20px;
box-shadow:0 12px 35px rgba(0,0,0,.10);text-align:center}
.logos{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:18px}
.logo{width:105px;height:105px;object-fit:contain;border-radius:14px}
.company{background:#202020}
h1{margin:8px 0;color:#0877c9;font-size:27px}
.verified{display:inline-block;color:#168a45;background:#e9f8ef;border:1px solid #bfe8ce;
padding:10px 18px;border-radius:999px;font-weight:bold;font-size:18px;margin:10px 0 22px}
.data{text-align:right;background:#f7f9fc;border-radius:18px;padding:18px 17px;line-height:2.05}
.row{padding:7px 0;border-bottom:1px solid #e5ebf0}
.row:last-child{border-bottom:0}
strong{color:#0877c9}
.footer{margin-top:20px;color:#7a8491;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<main class="card">
<div class="logos">
<img class="logo" src="hesperides.jpg" alt="أكاديمية هسبريدس">
<img class="logo company" src="morabbaat.jpg" alt="شركة المربعات الهندسية">
</div>
<h1>التحقق من الشهادة</h1>
<div class="verified">✓ تم التحقق بنجاح</div>
<section class="data">
<div class="row"><strong>الاسم:</strong> علاء الدين آدم محمد علي</div>
<div class="row"><strong>الجهة:</strong> أكاديمية هسبريدس</div>
<div class="row"><strong>الشركة:</strong> شركة المربعات الهندسية</div>
<div class="row"><strong>الدورة:</strong> الهندسة المدنية والتصميم والتنفيذ</div>
<div class="row"><strong>التخصص:</strong> الهندسة المدنية</div>
<div class="row"><strong>تاريخ التخرج:</strong> 15 يوليو 2026</div>
</section>
<div class="footer">صفحة إلكترونية مخصصة للتحقق من بيانات الشهادة عبر رمز QR.</div>
</main>
</body>
</html>
